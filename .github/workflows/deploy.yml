name: Build portfolio for GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.nojekyll'
      - 'assets/**'
      - 'favicon.svg'
      - 'index.html'
      - 'og.png'
      - 'Victor-Paul-Noel-CV.pdf'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        env:
          SITE_BASE_PATH: ''
        run: pnpm build:github
      - name: Update published files
        run: |
          rm -rf assets
          cp -R dist/github/assets assets
          cp dist/github/.nojekyll .nojekyll
          cp dist/github/favicon.svg favicon.svg
          cp dist/github/index.html index.html
          cp dist/github/og.png og.png
          cp dist/github/Victor-Paul-Noel-CV.pdf Victor-Paul-Noel-CV.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll assets favicon.svg index.html og.png Victor-Paul-Noel-CV.pdf
          if git diff --cached --quiet; then
            echo "Published files are already current."
          else
            git commit -m "Update published portfolio"
            git push
          fi

